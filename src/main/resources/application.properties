spring.application.name=tetris-multiplayer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# TODO: Configure separate profiles for development (H2) vs production (MySQL/PostgreSQL)
# TODO: Add database connection pooling configuration for production
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JWT Configuration
# TODO: Move jwt.secret to environment variables or external configuration for production
# TODO: Use a secure random key generator for production JWT secrets
jwt.secret=tetris-multiplayer-secret-key-change-in-production-environment-12345
jwt.expiration=86400000

# Server configuration
server.port=8080
server.servlet.context-path=/api

# WebSocket configuration
spring.websocket.enabled=true
